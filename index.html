<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="animations.css"
    >

    <title>ITACHI_ARABIC_STREEK</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d0d12;
            color: white;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            background: #15151d;

            border-bottom:
                1px solid #292936;
        }


        /* =========================
           BRAND
        ========================= */

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        /* =========================
           ITACHI LOGO
        ========================= */

        .itachi-logo {
            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 12px;

            overflow: hidden;

            background: #000;

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            box-shadow:
                0 0 14px
                rgba(255, 0, 0, 0.18);
        }


        .itachi-logo img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        /* =========================
           SITE NAME
        ========================= */

        .logo {
            font-size: 20px;
            font-weight: bold;
        }


        /* =========================
           HEADER ACTIONS
        ========================= */

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {
            padding: 9px 16px;

            border: none;
            border-radius: 10px;

            background: #6c3cff;

            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.2s ease;
        }


        .login-button:hover {
            background: #7b50ff;
        }


        .login-button:active {
            transform: scale(0.96);
        }


        /* =========================
           MENU BUTTON
        ========================= */

        .menu-button {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 11px;

            background: transparent;

            color: white;

            cursor: pointer;
        }


        .menu-button:hover {
            background: #242432;
        }


        .menu-button svg {
            width: 25px;
            height: 25px;
        }


        /* =========================
           OVERLAY
        ========================= */

        .menu-overlay {
            position: fixed;
            inset: 0;

            background:
                rgba(0, 0, 0, 0.58);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

            z-index: 90;
        }


        .menu-overlay.open {
            opacity: 1;
            visibility: visible;
        }


        /* =========================
           SIDE MENU
        ========================= */

        .side-menu {
            position: fixed;

            top: 0;
            right: 0;

            width: 310px;
            max-width: 88vw;

            height: 100vh;

            padding: 20px;

            background: #121219;

            border-left:
                1px solid #30303d;

            box-shadow:
                -12px 0 35px
                rgba(0, 0, 0, 0.40);

            transform:
                translateX(105%);

            transition:
                transform 0.28s
                cubic-bezier(.2,.8,.2,1);

            z-index: 100;

            overflow-y: auto;
        }


        .side-menu.open {
            transform: translateX(0);
        }


        /* =========================
           MENU HEADER
        ========================= */

        .menu-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding-bottom: 20px;

            border-bottom:
                1px solid #292936;
        }


        .menu-brand {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        .menu-brand-logo {
            width: 42px;
            height: 42px;

            border-radius: 11px;

            overflow: hidden;

            background: #000;
        }


        .menu-brand-logo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        .menu-title {
            font-size: 15px;
            font-weight: bold;
        }


        .menu-subtitle {
            margin-top: 4px;

            color: #888894;

            font-size: 11px;
        }


        /* =========================
           CLOSE
        ========================= */

        .close-button {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 10px;

            background: #20202a;

            color: white;

            cursor: pointer;
        }


        .close-button svg {
            width: 21px;
            height: 21px;
        }


        /* =========================
           MENU LINKS
        ========================= */

        .menu-links {
            margin-top: 20px;

            display: flex;
            flex-direction: column;

            gap: 7px;
        }


        .menu-link {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 12px;

            padding: 13px 14px;

            border: none;
            border-radius: 11px;

            background: transparent;

            color: #e9e9ef;

            font-size: 14px;

            text-align: right;

            cursor: pointer;
        }


        .menu-link:hover {
            background: #20202a;
        }


        .menu-link svg {
            width: 21px;
            height: 21px;

            flex-shrink: 0;
        }


        /* =========================
           SEPARATOR
        ========================= */

        .menu-separator {
            width: 100%;
            height: 1px;

            background: #292936;

            margin: 13px 0;
        }


        /* =========================
           AUTH
        ========================= */

        .auth-message {
            margin:
                5px 5px 12px;

            color: #888894;

            font-size: 12px;

            line-height: 1.7;
        }


        .auth-button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 11px;

            background: #6c3cff;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            margin-bottom: 8px;
        }


        .auth-button:hover {
            background: #7b50ff;
        }


        .register-button {
            background: #242432;
        }


        .register-button:hover {
            background: #30303f;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            max-width: 850px;

            margin: 40px auto;

            padding: 20px;
        }


        h1 {
            text-align: center;

            margin-bottom: 30px;
        }


        /* =========================
           TEXTAREA
        ========================= */

        textarea {
            width: 100%;

            min-height: 180px;

            resize: vertical;

            padding: 15px;

            border-radius: 12px;

            border:
                1px solid #333340;

            background: #171720;

            color: white;

            font-size: 17px;

            outline: none;
        }


        textarea:focus {
            border-color: #6c3cff;

            box-shadow:
                0 0 0 2px
                rgba(108, 60, 255, 0.12);
        }


        /* =========================
           LANGUAGES
        ========================= */

        .languages {
            display: flex;

            gap: 10px;

            align-items: center;

            margin: 15px 0;
        }


        select {
            flex: 1;

            padding: 13px;

            border-radius: 10px;

            background: #171720;

            color: white;

            border:
                1px solid #333340;

            font-size: 16px;

            outline: none;
        }


        /* =========================
           SWAP
        ========================= */

        .swap {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            border: none;

            background: #242432;

            color: white;

            font-size: 20px;

            cursor: pointer;
        }


        .swap:hover {
            background: #303041;
        }


        /* =========================
           TRANSLATE
        ========================= */

        .translate-btn {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #6c3cff;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            margin-bottom: 25px;
        }


        .translate-btn:hover {
            background: #7b50ff;
        }


        /* =========================
           RESULT
        ========================= */

        .result-title {
            margin-bottom: 10px;

            font-weight: bold;
        }


        .result {
            width: 100%;

            min-height: 180px;

            padding: 15px;

            border-radius: 12px;

            background: #171720;

            border:
                1px solid #333340;

            font-size: 17px;

            white-space: pre-wrap;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            text-align: center;

            margin-top: 15px;

            color: #aaa;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 0 10px;
            }


            .itachi-logo {
                width: 38px;
                height: 38px;
            }


            .logo {
                font-size: 14px;
            }


            .login-button {
                padding:
                    8px 10px;

                font-size: 12px;
            }


            .menu-button {
                width: 40px;
                height: 40px;
            }


            .container {
                margin-top: 20px;
                padding: 15px;
            }


            .languages {
                flex-direction: column;
            }


            select {
                width: 100%;
            }


            .swap {
                transform:
                    rotate(90deg);
            }


            .side-menu {
                width: 290px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>


    <div class="brand">


        <div
            class="itachi-logo"
            title="ITACHI UCHIHA"
        >

            <img
                src="images/itachi_logo.png"
                alt="ITACHI UCHIHA"
            >

        </div>


        <div class="logo">
            ITACHI_ARABIC_STREEK
        </div>

    </div>


    <div class="header-actions">


        <button
            id="loginButton"
            class="login-button"
            type="button"
            onclick="goToLogin()"
        >
            تسجيل الدخول
        </button>


        <button
            class="menu-button"
            type="button"
            onclick="openMenu()"
            aria-label="فتح القائمة"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
            >

                <line
                    x1="4"
                    y1="6"
                    x2="20"
                    y2="6"
                />

                <line
                    x1="4"
                    y1="12"
                    x2="20"
                    y2="12"
                />

                <line
                    x1="4"
                    y1="18"
                    x2="20"
                    y2="18"
                />

            </svg>

        </button>

    </div>

</header>



<!-- =========================
     OVERLAY
========================= -->

<div
    id="menuOverlay"
    class="menu-overlay"
    onclick="closeMenu()"
></div>



<!-- =========================
     SIDE MENU
========================= -->

<aside
    id="sideMenu"
    class="side-menu"
>


    <div class="menu-header">


        <div class="menu-brand">


            <div class="menu-brand-logo">

                <img
                    src="images/itachi_logo.png"
                    alt="ITACHI UCHIHA"
                >

            </div>


            <div>

                <div class="menu-title">
                    ITACHI ARABIC
                </div>

                <div class="menu-subtitle">
                    ITACHI_ARABIC_API
                </div>

            </div>

        </div>


        <button
            class="close-button"
            type="button"
            onclick="closeMenu()"
            aria-label="إغلاق القائمة"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
            >

                <line
                    x1="6"
                    y1="6"
                    x2="18"
                    y2="18"
                />

                <line
                    x1="18"
                    y1="6"
                    x2="6"
                    y2="18"
                />

            </svg>

        </button>

    </div>


    <div class="menu-links">


        <!-- الرئيسية -->

        <button
            class="menu-link"
            type="button"
            onclick="goTo('index.html')"
        >

            <span>الرئيسية</span>

        </button>


        <!-- المترجم -->

        <button
            class="menu-link"
            type="button"
            onclick="goTo('index.html')"
        >

            <span>المترجم</span>

        </button>


        <!-- لوحة التحكم -->

        <button
            class="menu-link"
            type="button"
            onclick="protectedPage('dashboard.html')"
        >

            <span>لوحة التحكم</span>

        </button>


        <!-- الملف الشخصي -->

        <button
            class="menu-link"
            type="button"
            onclick="protectedPage('profile.html')"
        >

            <span>الملف الشخصي</span>

        </button>


        <!-- الإعدادات -->

        <button
            class="menu-link"
            type="button"
            onclick="protectedPage('settings.html')"
        >

            <span>الإعدادات</span>

        </button>


        <div class="menu-separator"></div>


        <!-- تسجيل الدخول / إنشاء الحساب -->

        <div id="authArea"></div>

    </div>

</aside>



<!-- =========================
     MAIN TRANSLATOR
========================= -->

<div class="container">


    <h1>
        ترجمة النص
    </h1>


    <textarea
        id="text"
        placeholder="اكتب النص هنا..."
    ></textarea>


    <div class="languages">


        <select id="source">

            <option value="ar">
                العربية
            </option>

            <option value="en">
                English
            </option>

        </select>


        <button
            class="swap"
            type="button"
            onclick="swapLanguages()"
        >
            ⇄
        </button>


        <select id="target">

            <option value="en">
                English
            </option>

            <option value="ar">
                العربية
            </option>

        </select>

    </div>


    <button
        class="translate-btn"
        type="button"
        onclick="translateText()"
    >
        ترجمة
    </button>


    <div class="result-title">
        النتيجة
    </div>


    <div
        id="result"
        class="result"
    >
        ستظهر الترجمة هنا...
    </div>


    <div
        id="status"
        class="status"
    ></div>

</div>



<script>


/* =========================
   NAVIGATION
========================= */

function goTo(page) {

    window.location.href = page;

}


function goToLogin() {

    window.location.href =
        "login.html";

}


function goToRegister() {

    window.location.href =
        "register.html";

}



/* =========================
   MENU
========================= */

function openMenu() {

    document
        .getElementById("sideMenu")
        .classList
        .add("open");


    document
        .getElementById("menuOverlay")
        .classList
        .add("open");

}


function closeMenu() {

    document
        .getElementById("sideMenu")
        .classList
        .remove("open");


    document
        .getElementById("menuOverlay")
        .classList
        .remove("open");

}



/* =========================
   LOGIN STATE
========================= */

function isLoggedIn() {

    return (
        localStorage.getItem(
            "itachi_logged_in"
        ) === "true"
    );

}



/* =========================
   PROTECTED PAGE
========================= */

function protectedPage(page) {

    if (isLoggedIn()) {

        window.location.href =
            page;

        return;

    }


    showAuthMessage();

}



/* =========================
   AUTH AREA
========================= */

function showAuthMessage() {

    const authArea =
        document.getElementById(
            "authArea"
        );


    authArea.innerHTML = `

        <p class="auth-message">
            عليك تسجيل الدخول أو إنشاء
            حساب أولًا للوصول إلى هذه الصفحة.
        </p>


        <button
            class="auth-button"
            type="button"
            onclick="goToLogin()"
        >
            تسجيل الدخول
        </button>


        <button
            class="auth-button register-button"
            type="button"
            onclick="goToRegister()"
        >
            إنشاء حساب
        </button>

    `;

}



/* =========================
   BUILD AUTH MENU
========================= */

function buildAuthMenu() {

    const authArea =
        document.getElementById(
            "authArea"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    if (isLoggedIn()) {


        /* المستخدم مسجل */

        loginButton.textContent =
            "حسابي";


        loginButton.onclick =
            function() {

                window.location.href =
                    "profile.html";

            };


        authArea.innerHTML = `

            <button
                class="menu-link"
                type="button"
                onclick="goTo('dashboard.html')"
            >

                <span>
                    لوحة التحكم
                </span>

            </button>


            <button
                class="menu-link"
                type="button"
                onclick="logout()"
            >

                <span>
                    تسجيل الخروج
                </span>

            </button>

        `;


    } else {


        /* المستخدم غير مسجل */

        loginButton.textContent =
            "تسجيل الدخول";


        loginButton.onclick =
            goToLogin;


        authArea.innerHTML = `

            <p class="auth-message">
                سجّل الدخول أو أنشئ حسابًا
                للوصول إلى حسابك.
            </p>


            <button
                class="auth-button"
                type="button"
                onclick="goToLogin()"
            >
                تسجيل الدخول
            </button>


            <button
                class="auth-button register-button"
                type="button"
                onclick="goToRegister()"
            >
                إنشاء حساب
            </button>

        `;

    }

}



/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem(
        "itachi_logged_in"
    );


    window.location.href =
        "index.html";

}



/* =========================
   TRANSLATE
========================= */

async function translateText() {


    const text =
        document
            .getElementById("text")
            .value
            .trim();


    const source =
        document
            .getElementById("source")
            .value;


    const target =
        document
            .getElementById("target")
            .value;


    const result =
        document
            .getElementById("result");


    const status =
        document
            .getElementById("status");


    if (!text) {

        result.textContent =
            "اكتب نصًا أولًا.";

        status.textContent =
            "";

        return;

    }


    result.textContent =
        "جاري الترجمة...";


    status.textContent =
        "";


    try {

        const response =
            await fetch(
                "/translate",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            text: text,

                            source: source,

                            target: target,

                            website: true

                        })

                }
            );


        const data =
            await response.json();


        if (data.success) {

            result.textContent =
                data.translation;

            status.textContent =
                "تمت الترجمة";

        } else {

            result.textContent =
                data.message ||
                "حدث خطأ أثناء الترجمة.";

            status.textContent =
                "فشلت الترجمة";

        }


    } catch (error) {

        result.textContent =
            "تعذر الاتصال بالـ API.";

        status.textContent =
            "Server Error";

        console.error(error);

    }

}



/* =========================
   SWAP LANGUAGES
========================= */

function swapLanguages() {

    const source =
        document.getElementById(
            "source"
        );


    const target =
        document.getElementById(
            "target"
        );


    const oldSource =
        source.value;


    source.value =
        target.value;


    target.value =
        oldSource;

}



/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeMenu();

        }

    }
);



/* =========================
   START
========================= */

buildAuthMenu();

</script>


</body>

</html>
