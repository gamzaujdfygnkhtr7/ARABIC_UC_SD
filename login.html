<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>SOVT — تسجيل الدخول</title>

<link rel="stylesheet" href="animations.css">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(120, 0, 0, 0.15),
            transparent 35%
        ),
        #050505;

    color: #fff;

    font-family:
        Arial,
        "Segoe UI",
        sans-serif;
}

.page {

    width: 100%;
    max-width: 430px;
    margin: 0 auto;
}

.brand {

    width: 100%;
    text-align: center;
    margin-bottom: 22px;
}

.logo-box {

    width: 92px;
    height: 92px;

    margin: 0 auto 15px;

    overflow: hidden;

    border-radius: 22px;

    background: #050505;

    border:
        1px solid
        rgba(255,255,255,0.10);

    box-shadow:
        0 0 35px
        rgba(180,0,0,0.20);
}

.site-logo {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

.brand h1 {

    margin: 0;

    font-size: 24px;

    font-weight: 800;
}

.brand p {

    margin: 7px 0 0;

    color: #888;

    font-size: 13px;
}

.card {

    width: 100%;

    padding: 24px;

    border-radius: 22px;

    background:
        rgba(255,255,255,0.035);

    border:
        1px solid
        rgba(255,255,255,0.08);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.40);

    backdrop-filter: blur(18px);
}

.tabs {

    width: 100%;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 5px;

    padding: 5px;

    margin-bottom: 23px;

    border-radius: 13px;

    background:
        rgba(255,255,255,0.035);
}

.tab {

    width: 100%;

    height: 42px;

    border: 0;

    border-radius: 9px;

    background: transparent;

    color: #777;

    cursor: pointer;

    font-size: 14px;

    transition: 0.2s ease;
}

.tab:hover {

    color: #ccc;
}

.tab.active {

    color: #fff;

    background:
        rgba(255,255,255,0.09);

    box-shadow:
        0 0 15px
        rgba(255,255,255,0.03);
}

.form {

    display: none;

    width: 100%;
}

.form.active {

    display: block;
}

.field {

    width: 100%;

    margin-bottom: 15px;
}

.field label {

    display: block;

    margin-bottom: 7px;

    color: #bcbcbc;

    font-size: 13px;
}

.input {

    width: 100%;

    height: 48px;

    padding: 0 14px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,0.09);

    outline: none;

    background:
        rgba(0,0,0,0.30);

    color: #fff;

    font-size: 14px;

    direction: ltr;

    text-align: left;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.input::placeholder {

    color: #555;
}

.input:focus {

    border-color: #9b0000;

    box-shadow:
        0 0 0 3px
        rgba(155,0,0,0.12);
}

.main-button {

    width: 100%;

    height: 48px;

    margin-top: 4px;

    border: 0;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #750000,
            #b00000
        );

    color: #fff;

    cursor: pointer;

    font-size: 15px;

    font-weight: 700;

    transition:
        transform 0.18s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
}

.main-button:hover {

    box-shadow:
        0 8px 25px
        rgba(180,0,0,0.25);
}

.main-button:active {

    transform: scale(0.97);
}

.main-button:disabled {

    opacity: 0.55;

    cursor: not-allowed;

    transform: none;
}

.divider {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 10px;

    margin: 21px 0;

    color: #626262;

    font-size: 12px;
}

.divider::before,
.divider::after {

    content: "";

    height: 1px;

    flex: 1;

    background:
        rgba(255,255,255,0.08);
}

.social-buttons {

    width: 100%;

    display: grid;

    gap: 10px;
}

.social-button {

    width: 100%;

    height: 48px;

    padding: 0 16px;

    border-radius: 12px;

    border:
        1px solid
        rgba(255,255,255,0.10);

    background:
        rgba(255,255,255,0.035);

    color: #fff;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 11px;

    font-size: 14px;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.18s ease;
}

.social-button:hover {

    background:
        rgba(255,255,255,0.065);

    border-color:
        rgba(255,255,255,0.16);

    transform:
        translateY(-1px);
}

.social-button:active {

    transform:
        scale(0.97);
}

.social-button:disabled {

    opacity: 0.55;

    cursor: not-allowed;
}

.social-icon {

    width: 22px;
    height: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;
}

.social-icon svg {

    width: 22px;
    height: 22px;

    display: block;
}

.message {

    display: none;

    width: 100%;

    margin-top: 15px;

    padding: 11px;

    border-radius: 10px;

    text-align: center;

    font-size: 13px;

    line-height: 1.5;
}

.message.success {

    display: block;

    color: #7ff0bd;

    background:
        rgba(0,180,100,0.08);

    border:
        1px solid
        rgba(0,180,100,0.20);
}

.message.error {

    display: block;

    color: #ff8585;

    background:
        rgba(255,50,50,0.08);

    border:
        1px solid
        rgba(255,50,50,0.20);
}

.footer {

    width: 100%;

    text-align: center;

    margin-top: 17px;

    color: #555;

    font-size: 11px;
}

@media (max-width: 480px) {

    body {
        padding: 14px;
    }

    .card {
        padding: 20px;
    }

    .logo-box {

        width: 82px;
        height: 82px;
    }

    .brand h1 {
        font-size: 22px;
    }

}

</style>

</head>

<body>

<div class="page">

    <div class="brand">

        <div class="logo-box">

            <img
                src="images/itachi_logo.png"
                alt="ITACHI ARABIC"
                class="site-logo"
            >

        </div>

        <h1>
            SOVT
        </h1>

        <p>
            ترجمة ذكية وسريعة
        </p>

    </div>


    <div class="card">

        <div class="tabs">

            <button
                id="loginTab"
                class="tab active"
                type="button"
                onclick="showForm('login')"
            >
                تسجيل الدخول
            </button>

            <button
                id="registerTab"
                class="tab"
                type="button"
                onclick="showForm('register')"
            >
                إنشاء حساب
            </button>

        </div>


        <!-- LOGIN -->

        <form
            id="loginForm"
            class="form active"
            onsubmit="login(event)"
        >

            <div class="field">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    id="loginEmail"
                    class="input"
                    type="email"
                    autocomplete="email"
                    placeholder="example@email.com"
                    required
                >

            </div>


            <div class="field">

                <label>
                    كلمة المرور
                </label>

                <input
                    id="loginPassword"
                    class="input"
                    type="password"
                    autocomplete="current-password"
                    placeholder="كلمة المرور"
                    required
                >

            </div>


            <button
                id="loginButton"
                class="main-button"
                type="submit"
            >
                تسجيل الدخول
            </button>

        </form>


        <!-- REGISTER -->

        <form
            id="registerForm"
            class="form"
            onsubmit="register(event)"
        >

            <div class="field">

                <label>
                    اسم المستخدم
                </label>

                <input
                    id="registerUsername"
                    class="input"
                    type="text"
                    autocomplete="username"
                    placeholder="اسم المستخدم"
                    minlength="3"
                    maxlength="30"
                    required
                >

            </div>


            <div class="field">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    id="registerEmail"
                    class="input"
                    type="email"
                    autocomplete="email"
                    placeholder="example@email.com"
                    required
                >

            </div>


            <div class="field">

                <label>
                    كلمة المرور
                </label>

                <input
                    id="registerPassword"
                    class="input"
                    type="password"
                    autocomplete="new-password"
                    placeholder="8 أحرف على الأقل"
                    minlength="8"
                    required
                >

            </div>


            <div class="field">

                <label>
                    تأكيد كلمة المرور
                </label>

                <input
                    id="registerPasswordConfirm"
                    class="input"
                    type="password"
                    autocomplete="new-password"
                    placeholder="أعد كتابة كلمة المرور"
                    minlength="8"
                    required
                >

            </div>


            <button
                id="registerButton"
                class="main-button"
                type="submit"
            >
                إنشاء الحساب
            </button>

        </form>


        <div class="divider">
            أو المتابعة باستخدام
        </div>


        <div class="social-buttons">


            <!-- GOOGLE -->

            <button
                id="googleButton"
                class="social-button"
                type="button"
                onclick="googleLogin()"
            >

                <span class="social-icon">

                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <path
                            fill="#4285F4"
                            d="M21.35 12.23c0-.74-.07-1.46-.21-2.14H12v4.05h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.3z"
                        />

                        <path
                            fill="#34A853"
                            d="M12 21.8c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.53A9.75 9.75 0 0 0 12 21.8z"
                        />

                        <path
                            fill="#FBBC05"
                            d="M6.54 13.88A5.86 5.86 0 0 1 6.23 12c0-.65.11-1.28.31-1.88V7.59H3.29A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.04 4.41l3.25-2.53z"
                        />

                        <path
                            fill="#EA4335"
                            d="M12 6.09c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.19 14.63 2.2 12 2.2a9.75 9.75 0 0 0-8.71 5.39l3.25 2.53C7.31 7.81 9.46 6.09 12 6.09z"
                        />

                    </svg>

                </span>

                <span>
                    المتابعة باستخدام Google
                </span>

            </button>


            <!-- GITHUB -->

            <button
                id="githubButton"
                class="social-button"
                type="button"
                onclick="githubLogin()"
            >

                <span class="social-icon">

                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <path
                            fill="#ffffff"
                            d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55v-2.14c-3.2.7-3.87-1.35-3.87-1.35-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.25 3.32.96.1-.74.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.25 5.68.41.35.77 1.04.77 2.1v3.12c0 .3.2.65.79.54A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"
                        />

                    </svg>

                </span>

                <span>
                    المتابعة باستخدام GitHub
                </span>

            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>

    </div>


    <div class="footer">
        SOVT
    </div>

</div>


<!-- SOVT FIREBASE AUTH -->

<script src="js/auth.js"></script>


<script>

const SITE_URL =
    "https://arabic-uch-sd.pages.dev/";


/* MESSAGE */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    if (!message) return;

    message.textContent = text;

    message.className =
        "message " + type;
}


function clearMessage() {

    const message =
        document.getElementById("message");

    if (!message) return;

    message.textContent = "";

    message.className = "message";
}


/* FORM SWITCH */

function showForm(type) {

    const loginForm =
        document.getElementById("loginForm");

    const registerForm =
        document.getElementById("registerForm");

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");


    if (type === "login") {

        loginForm.classList.add("active");
        registerForm.classList.remove("active");

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

    } else {

        registerForm.classList.add("active");
        loginForm.classList.remove("active");

        registerTab.classList.add("active");
        loginTab.classList.remove("active");

    }

    clearMessage();
}


/* FIREBASE READY */

async function waitForFirebase() {

    let attempts = 0;

    while (attempts < 100) {

        if (
            window.SOVTFirebase &&
            typeof window.SOVTFirebase.ready === "function"
        ) {

            await window.SOVTFirebase.ready();

            return window.SOVTFirebase;
        }

        await new Promise(
            resolve => setTimeout(resolve, 100)
        );

        attempts++;
    }

    throw new Error(
        "تعذر تشغيل Firebase."
    );
}


/* FIREBASE ERROR */

function firebaseErrorMessage(error) {

    const code =
        error && error.code
            ? error.code
            : "";


    const messages = {

        "auth/invalid-email":
            "البريد الإلكتروني غير صحيح.",

        "auth/user-not-found":
            "لا يوجد حساب بهذا البريد الإلكتروني.",

        "auth/wrong-password":
            "كلمة المرور غير صحيحة.",

        "auth/invalid-credential":
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.",

        "auth/email-already-in-use":
            "هذا البريد الإلكتروني مستخدم بالفعل.",

        "auth/weak-password":
            "كلمة المرور ضعيفة. استخدم 8 أحرف أو أكثر.",

        "auth/popup-closed-by-user":
            "تم إغلاق نافذة تسجيل الدخول.",

        "auth/popup-blocked":
            "تم منع نافذة تسجيل الدخول من المتصفح.",

        "auth/network-request-failed":
            "حدثت مشكلة في الاتصال بالإنترنت.",

        "auth/too-many-requests":
            "تم إجراء محاولات كثيرة. حاول لاحقًا.",

        "auth/user-disabled":
            "هذا الحساب معطل.",

        "auth/operation-not-allowed":
            "طريقة تسجيل الدخول هذه غير مفعلة في Firebase.",

        "auth/unauthorized-domain":
            "هذا النطاق غير مضاف إلى النطاقات المسموح بها في Firebase."

    };


    return (
        messages[code] ||
        (error && error.message) ||
        "حدث خطأ أثناء تسجيل الدخول."
    );
}


/* REGISTER */

async function register(event) {

    event.preventDefault();

    clearMessage();


    const username =
        document
            .getElementById("registerUsername")
            .value
            .trim();


    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("registerPassword")
            .value;


    const confirmPassword =
        document
            .getElementById("registerPasswordConfirm")
            .value;


    if (username.length < 3) {

        showMessage(
            "اسم المستخدم يجب أن يكون 3 أحرف على الأقل.",
            "error"
        );

        return;
    }


    if (password.length < 8) {

        showMessage(
            "كلمة المرور يجب أن تكون 8 أحرف على الأقل.",
            "error"
        );

        return;
    }


    if (password !== confirmPassword) {

        showMessage(
            "كلمتا المرور غير متطابقتين.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "registerButton"
        );


    button.disabled = true;

    button.textContent =
        "جاري إنشاء الحساب...";


    try {

        const firebase =
            await waitForFirebase();


        const user =
            await firebase.registerWithEmail(
                email,
                password,
                username
            );


        if (user) {

            localStorage.setItem(
                "itachi_logged_in",
                "true"
            );


            showMessage(
                "تم إنشاء الحساب وتسجيل الدخول بنجاح ✔️",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        SITE_URL;

                },
                900
            );

        }


    } catch (error) {

        console.error(
            "SOVT REGISTER ERROR:",
            error
        );


        showMessage(
            firebaseErrorMessage(error),
            "error"
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "إنشاء الحساب";

    }

}


/* LOGIN */

async function login(event) {

    event.preventDefault();

    clearMessage();


    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled = true;

    button.textContent =
        "جاري تسجيل الدخول...";


    try {

        const firebase =
            await waitForFirebase();


        const user =
            await firebase.loginWithEmail(
                email,
                password
            );


        if (user) {

            localStorage.setItem(
                "itachi_logged_in",
                "true"
            );


            showMessage(
                "تم تسجيل الدخول بنجاح ✔️",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        SITE_URL;

                },
                700
            );

        }


    } catch (error) {

        console.error(
            "SOVT LOGIN ERROR:",
            error
        );


        showMessage(
            firebaseErrorMessage(error),
            "error"
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "تسجيل الدخول";

    }

}


/* GOOGLE */

async function googleLogin() {

    clearMessage();


    const button =
        document.getElementById(
            "googleButton"
        );


    button.disabled = true;


    try {

        showMessage(
            "جاري فتح Google...",
            "success"
        );


        const firebase =
            await waitForFirebase();


        await firebase.googleLogin();


        localStorage.setItem(
            "itachi_logged_in",
            "true"
        );


        showMessage(
            "تم تسجيل الدخول بواسطة Google ✔️",
            "success"
        );


        setTimeout(
            () => {

                window.location.href =
                    SITE_URL;

            },
            700
        );


    } catch (error) {

        console.error(
            "SOVT GOOGLE LOGIN ERROR:",
            error
        );


        showMessage(
            firebaseErrorMessage(error),
            "error"
        );

    } finally {

        button.disabled = false;

    }

}


/* GITHUB */

async function githubLogin() {

    clearMessage();


    const button =
        document.getElementById(
            "githubButton"
        );


    button.disabled = true;


    try {

        showMessage(
            "جاري فتح GitHub...",
            "success"
        );


        const firebase =
            await waitForFirebase();


        await firebase.githubLogin();


        localStorage.setItem(
            "itachi_logged_in",
            "true"
        );


        showMessage(
            "تم تسجيل الدخول بواسطة GitHub ✔️",
            "success"
        );


        setTimeout(
            () => {

                window.location.href =
                    SITE_URL;

            },
            700
        );


    } catch (error) {

        console.error(
            "SOVT GITHUB LOGIN ERROR:",
            error
        );


        showMessage(
            firebaseErrorMessage(error),
            "error"
        );

    } finally {

        button.disabled = false;

    }

}


/* SESSION */

async function checkSession() {

    try {

        const firebase =
            await waitForFirebase();


        const user =
            await firebase.getCurrentUser();


        if (user) {

            localStorage.setItem(
                "itachi_logged_in",
                "true"
            );


            console.log(
                "SOVT المستخدم مسجل الدخول:",
                user.email
            );

        }

    } catch (error) {

        console.error(
            "SOVT SESSION ERROR:",
            error
        );

    }

}


/* START */

document.addEventListener(
    "DOMContentLoaded",
