<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>ITACHI ARABIC — تسجيل الدخول</title>

    <link
        rel="stylesheet"
        href="animations.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(100, 60, 255, 0.10),
                    transparent 35%
                ),
                #050505;

            color: #ffffff;

            font-family:
                Arial,
                "Segoe UI",
                sans-serif;
        }

        .page {

            width: 100%;

            max-width: 430px;

            margin: 0 auto;
        }

        .brand {

            width: 100%;

            text-align: center;

            margin-bottom: 22px;
        }

        .logo-box {

            width: 92px;

            height: 92px;

            margin:
                0 auto 15px;

            padding: 0;

            overflow: hidden;

            border-radius: 22px;

            background: #050505;

            border:
                1px solid
                rgba(255,255,255,0.10);

            box-shadow:
                0 0 35px
                rgba(180,0,0,0.16);
        }

        .site-logo {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;
        }

        .brand h1 {

            margin: 0;

            font-size: 24px;

            font-weight: 800;

            letter-spacing: 0.3px;
        }

        .brand p {

            margin:
                7px 0 0;

            color: #888888;

            font-size: 13px;
        }

        .card {

            width: 100%;

            padding: 24px;

            border-radius: 22px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid
                rgba(255,255,255,0.08);

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.40);

            backdrop-filter: blur(18px);
        }

        .tabs {

            width: 100%;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 5px;

            padding: 5px;

            margin-bottom: 23px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.035);
        }

        .tab {

            width: 100%;

            height: 42px;

            border: 0;

            border-radius: 9px;

            background: transparent;

            color: #777777;

            cursor: pointer;

            font-size: 14px;

            transition:
                0.2s ease;
        }

        .tab.active {

            color: #ffffff;

            background:
                rgba(255,255,255,0.09);
        }

        .form {

            display: none;

            width: 100%;
        }

        .form.active {

            display: block;
        }

        .field {

            width: 100%;

            margin-bottom: 15px;
        }

        .field label {

            display: block;

            margin-bottom: 7px;

            color: #bcbcbc;

            font-size: 13px;
        }

        .input {

            width: 100%;

            height: 48px;

            padding: 0 14px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.09);

            outline: none;

            background:
                rgba(0,0,0,0.30);

            color: #ffffff;

            font-size: 14px;

            direction: ltr;

            text-align: left;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input::placeholder {

            color: #555555;
        }

        .input:focus {

            border-color:
                rgba(139,92,246,0.80);

            box-shadow:
                0 0 0 3px
                rgba(139,92,246,0.10);
        }

        .main-button {

            width: 100%;

            height: 48px;

            margin-top: 4px;

            border: 0;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #6d28d9,
                    #8b5cf6
                );

            color: #ffffff;

            cursor: pointer;

            font-size: 15px;

            font-weight: 700;

            transition:
                transform 0.18s ease,
                box-shadow 0.2s ease;
        }

        .main-button:hover {

            box-shadow:
                0 8px 25px
                rgba(139,92,246,0.20);
        }

        .main-button:active {

            transform:
                scale(0.97);
        }

        .divider {

            width: 100%;

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 21px 0;

            color: #626262;

            font-size: 12px;
        }

        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            flex: 1;

            background:
                rgba(255,255,255,0.08);
        }

        .social-buttons {

            width: 100%;

            display: grid;

            gap: 10px;
        }

        .social-button {

            width: 100%;

            height: 48px;

            padding: 0 16px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            background:
                rgba(255,255,255,0.035);

            color: #ffffff;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 11px;

            font-size: 14px;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.18s ease;
        }

        .social-button:hover {

            background:
                rgba(255,255,255,0.065);

            border-color:
                rgba(255,255,255,0.16);

            transform:
                translateY(-1px);
        }

        .social-button:active {

            transform:
                scale(0.97);
        }

        .social-icon {

            width: 22px;

            height: 22px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .social-icon svg {

            width: 22px;

            height: 22px;

            display: block;
        }

        .message {

            display: none;

            width: 100%;

            margin-top: 15px;

            padding: 11px;

            border-radius: 10px;

            text-align: center;

            font-size: 13px;
        }

        .message.success {

            display: block;

            color: #7ff0bd;

            background:
                rgba(0,180,100,0.08);

            border:
                1px solid
                rgba(0,180,100,0.20);
        }

        .message.error {

            display: block;

            color: #ff8585;

            background:
                rgba(255,50,50,0.08);

            border:
                1px solid
                rgba(255,50,50,0.20);
        }

        .footer {

            width: 100%;

            text-align: center;

            margin-top: 17px;

            color: #555555;

            font-size: 11px;
        }

        @media (max-width: 480px) {

            body {

                padding: 14px;
            }

            .card {

                padding: 20px;
            }

            .logo-box {

                width: 82px;

                height: 82px;
            }

            .brand h1 {

                font-size: 22px;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <div class="brand">

        <div class="logo-box">

            <img
                src="images/itachi_logo.png"
                alt="ITACHI ARABIC"
                class="site-logo"
            >

        </div>

        <h1>
            ITACHI ARABIC
        </h1>

        <p>
            ترجمة ذكية وسريعة
        </p>

    </div>


    <div class="card">


        <div class="tabs">

            <button
                id="loginTab"
                class="tab active"
                type="button"
                onclick="showForm('login')"
            >
                تسجيل الدخول
            </button>

            <button
                id="registerTab"
                class="tab"
                type="button"
                onclick="showForm('register')"
            >
                إنشاء حساب
            </button>

        </div>


        <form
            id="loginForm"
            class="form active"
            onsubmit="login(event)"
        >

            <div class="field">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    id="loginEmail"
                    class="input"
                    type="email"
                    autocomplete="email"
                    placeholder="example@email.com"
                    required
                >

            </div>


            <div class="field">

                <label>
                    كلمة المرور
                </label>

                <input
                    id="loginPassword"
                    class="input"
                    type="password"
                    autocomplete="current-password"
                    placeholder="••••••••"
                    required
                >

            </div>


            <button
                class="main-button"
                type="submit"
            >
                تسجيل الدخول
            </button>

        </form>


        <form
            id="registerForm"
            class="form"
            onsubmit="register(event)"
        >

            <div class="field">

                <label>
                    اسم المستخدم
                </label>

                <input
                    id="registerUsername"
                    class="input"
                    type="text"
                    autocomplete="username"
                    placeholder="اسم المستخدم"
                    minlength="3"
                    maxlength="30"
                    required
                >

            </div>


            <div class="field">

                <label>
                    البريد الإلكتروني
                </label>

                <input
                    id="registerEmail"
                    class="input"
                    type="email"
                    autocomplete="email"
                    placeholder="example@email.com"
                    required
                >

            </div>


            <div class="field">

                <label>
                    كلمة المرور
                </label>

                <input
                    id="registerPassword"
                    class="input"
                    type="password"
                    autocomplete="new-password"
                    placeholder="••••••••"
                    minlength="8"
                    required
                >

            </div>


            <div class="field">

                <label>
                    تأكيد كلمة المرور
                </label>

                <input
                    id="registerPasswordConfirm"
                    class="input"
                    type="password"
                    autocomplete="new-password"
                    placeholder="••••••••"
                    minlength="8"
                    required
                >

            </div>


            <button
                class="main-button"
                type="submit"
            >
                إنشاء الحساب
            </button>

        </form>


        <div class="divider">

            أو المتابعة باستخدام

        </div>


        <div class="social-buttons">


            <button
                class="social-button"
                type="button"
                onclick="googleLogin()"
            >

                <span class="social-icon">

                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <path
                            fill="#4285F4"
                            d="M21.35 12.23c0-.74-.07-1.46-.21-2.14H12v4.05h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.3z"
                        />

                        <path
                            fill="#34A853"
                            d="M12 21.8c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.53A9.75 9.75 0 0 0 12 21.8z"
                        />

                        <path
                            fill="#FBBC05"
                            d="M6.54 13.88A5.86 5.86 0 0 1 6.23 12c0-.65.11-1.28.31-1.88V7.59H3.29A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.04 4.41l3.25-2.53z"
                        />

                        <path
                            fill="#EA4335"
                            d="M12 6.09c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.19 14.63 2.2 12 2.2a9.75 9.75 0 0 0-8.71 5.39l3.25 2.53C7.31 7.81 9.46 6.09 12 6.09z"
                        />

                    </svg>

                </span>

                <span>
                    المتابعة باستخدام Google
                </span>

            </button>


            <button
                class="social-button"
                type="button"
                onclick="appleLogin()"
            >

                <span class="social-icon">

                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <path
                            fill="#FFFFFF"
                            d="M17.05 12.54c-.02-2.23 1.82-3.3 1.9-3.35a4.1 4.1 0 0 0-3.22-1.74c-1.36-.14-2.65.8-3.34.8-.69 0-1.75-.78-2.88-.76-1.48.02-2.84.86-3.6 2.18-1.55 2.69-.4 6.65 1.1 8.83.74 1.07 1.62 2.27 2.77 2.23 1.12-.05 1.54-.72 2.9-.72 1.35 0 1.73.72 2.9.7 1.2-.02 1.96-1.08 2.7-2.15a8.8 8.8 0 0 0 1.22-2.5 3.86 3.86 0 0 1-2.45-3.52z"
                        />

                        <path
                            fill="#FFFFFF"
                            d="M14.86 6.02c.61-.74 1.02-1.76.91-2.78-.88.04-1.95.59-2.58 1.32-.56.64-1.06 1.67-.93 2.65.99.08 1.99-.5 2.6-1.19z"
                        />

                    </svg>

                </span>

                <span>
                    المتابعة باستخدام Apple
                </span>

            </button>


            <button
                class="social-button"
                type="button"
                onclick="discordLogin()"
            >

                <span class="social-icon">

                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <path
                            fill="#5865F2"
                            d="M19.54 5.2A16.2 16.2 0 0 0 15.57 4l-.48.98a14.7 14.7 0 0 0-6.18 0L8.43 4a16.2 16.2 0 0 0-3.97 1.2C2.39 8.68 1.7 12.38 2.04 16.1a16.2 16.2 0 0 0 4.96 2.52l1.2-1.65a9.5 9.5 0 0 1-1.85-.9l.45-.35c3.47 1.62 7.67 1.62 11.1 0l.46.35c-.58.36-1.2.66-1.85.9l1.2 1.65a16.2 16.2 0 0 0 4.96-2.52c.4-4.3-.65-8.03-3.13-10.9z"
                        />

                        <circle
                            cx="8.5"
                            cy="12"
                            r="1.25"
                            fill="#050505"
                        />

                        <circle
                            cx="15.5"
                            cy="12"
                            r="1.25"
                            fill="#050505"
                        />

                    </svg>

                </span>

                <span>
                    المتابعة باستخدام Discord
                </span>

            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


    </div>


    <div class="footer">

        ITACHI_ARABIC_STREEK

    </div>


</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
    "https://oqrdadmfpwgrfcphddbu.supabase.co";


/*
   ضع هنا Supabase Publishable Key
   أو anon public key إذا كان مشروعك يستخدم النظام القديم.
*/

const SUPABASE_ANON_KEY =
    "sb_publishable_gHcWL0VoJXUTL4JXGZilZA_na0KSJQZ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ==============================
   FORM SWITCH
============================== */

function showForm(type) {

    const loginForm =
        document.getElementById("loginForm");

    const registerForm =
        document.getElementById("registerForm");

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");


    if (type === "login") {

        loginForm.classList.add("active");

        registerForm.classList.remove("active");

        loginTab.classList.add("active");

        registerTab.classList.remove("active");

    } else {

        registerForm.classList.add("active");

        loginForm.classList.remove("active");

        registerTab.classList.add("active");

        loginTab.classList.remove("active");

    }


    clearMessage();

}


/* ==============================
   MESSAGE
============================== */

function showMessage(text, type) {

    const message =
        document.getElementById("message");


    message.textContent = text;

    message.className =
        "message " + type;

}


function clearMessage() {

    const message =
        document.getElementById("message");


    message.textContent = "";

    message.className = "message";

}


/* ==============================
   LOGIN
============================== */

async function login(event) {

    event.preventDefault();

    clearMessage();


    const email =
        document.getElementById("loginEmail").value.trim();


    const password =
        document.getElementById("loginPassword").value;


    showMessage(
        "جاري تسجيل الدخول...",
        "success"
    );


    try {

        const response =
            await fetch(
                "/api/login",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body:
                        JSON.stringify({
                            email: email,
                            password: password
                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showMessage(
                data.message ||
                "بيانات تسجيل الدخول غير صحيحة.",
                "error"
            );

            return;

        }


        showMessage(
            "تم تسجيل الدخول بنجاح ✅",
            "success"
        );


        setTimeout(
            function () {

                window.location.href = "/";

            },
            700
        );


    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );


        showMessage(
            "تعذر الاتصال بالخادم.",
            "error"
        );

    }

}


/* ==============================
   REGISTER
============================== */

async function register(event) {

    event.preventDefault();

    clearMessage();


    const username =
        document.getElementById(
            "registerUsername"
        ).value.trim();


    const email =
        document.getElementById(
            "registerEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "registerPassword"
        ).value;


    const confirm =
        document.getElementById(
            "registerPasswordConfirm"
        ).value;


    if (username.length < 3) {

        showMessage(
            "اسم المستخدم يجب أن يكون 3 أحرف على الأقل.",
            "error"
        );

        return;

    }


    if (password.length < 8) {

        showMessage(
            "كلمة المرور يجب أن تكون 8 أحرف على الأقل.",
            "error"
        );

        return;

    }


    if (password !== confirm) {

        showMessage(
            "كلمتا المرور غير متطابقتين.",
            "error"
        );

        return;

    }


    showMessage(
        "جاري إنشاء الحساب...",
        "success"
    );


    try {

        const response =
            await fetch(
                "/api/register",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body:
                        JSON.stringify({
                            username: username,
                            email: email,
                            password: password
                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            showMessage(
                data.message ||
                "تعذر إنشاء الحساب.",
                "error"
            );

            return;

        }


        showMessage(
            "تم إنشاء الحساب بنجاح ✅",
            "success"
        );


        setTimeout(
            function () {

                window.location.href = "/";

            },
            800
        );


    } catch (error) {

        console.error(
            "REGISTER ERROR:",
            error
        );


        showMessage(
            "تعذر الاتصال بالخادم.",
            "error"
        );

    }

}


/* ==============================
   GOOGLE — SUPABASE
============================== */

async function googleLogin() {

    clearMessage();


    showMessage(
        "جاري فتح تسجيل الدخول باستخدام Google...",
        "success"
    );


    try {

        const { error } =
            await supabaseClient.auth.signInWithOAuth({

                provider: "google",

                options: {

                    redirectTo:
                        "https://itachisd.netlify.app/"

                }

            });


        if (error) {

            console.error(
                "GOOGLE LOGIN ERROR:",
                error
            );


            showMessage(
                "حدث خطأ أثناء تسجيل الدخول باستخدام Google.",
                "error"
            );

        }

    } catch (error) {

        console.error(
            "GOOGLE LOGIN ERROR:",
            error
        );


        showMessage(
            "حدث خطأ أثناء الاتصال بخدمة Google.",
            "error"
        );

    }

}


/* ==============================
   APPLE
============================== */

function appleLogin() {

    window.location.href =
        "/auth/apple";

}


/* ==============================
   DISCORD
============================== */

function discordLogin() {

    window.location.href =
        "/auth/discord";

}


/* ==============================
   CHECK LOGIN
============================== */

async function checkLogin() {

    try {

        const response =
            await fetch(
                "/api/me",
                {

                    method: "GET",

                    credentials:
                        "include"

                }
            );


        const data =
            await response.json();


        if (
            data.success &&
            data.logged_in
        ) {

            console.log(
                "Logged in:",
                data.user
            );

        }

    } catch (error) {

        console.error(
            "SESSION ERROR:",
            error
        );

    }

}


checkLogin();

</script>


</body>

</html>
